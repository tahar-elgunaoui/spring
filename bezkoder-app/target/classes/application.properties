# JWT Configuration
app.jwtSecret= bezKoderSecretKeyForJWTHS256AlgorithmMustBeAtLeast256BitsLongToComplyWithRFC7518
app.jwtExpirationMs= 86400000

# Database Configuration (will be overridden by Docker environment)
spring.datasource.url= jdbc:mysql://localhost:3306/bezkoder_db?useSSL=false
spring.datasource.username= root
spring.datasource.password= 123456

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto= update

# Server Configuration
server.port= 8080

# Logging
logging.level.com.bezkoder.spring.datajpa= DEBUG
logging.level.org.springframework.security= DEBUG